name: Publish website preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jaford-preview
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      VITE_ANALYTICS_COLLECT_URL: ${{ vars.VITE_ANALYTICS_COLLECT_URL }}
      VITE_ANALYTICS_ADMIN_URL: ${{ vars.VITE_ANALYTICS_ADMIN_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/indexnow.mjs prepare
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:seo
      - run: npm run test:analytics
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build:preview
      - run: SEO_BUILD_DIR=.preview-dist npm run test:seo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .preview-dist
      - name: Publish to the stable preview address
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify participating search engines of published content changes
        continue-on-error: true
        run: node scripts/indexnow.mjs submit
      - name: Check public social link access
        continue-on-error: true
        run: node scripts/check-social-links.mjs
